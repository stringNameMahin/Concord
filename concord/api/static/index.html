<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord — fact knowledge layer</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1a1a19; --muted: #6b6b66;
    --line: #e2e0da; --accent: #2f5d50; --mark: #fdf0a8; --mark-line: #d9b800;
    --corroborates: #2f7a4f; --contradicts: #a3352a; --reconciled: #8a5a1a;
    --insufficient: #5b5f78; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  h1 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
  nav { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
  nav button, .filters button { font: inherit; padding: 6px 13px; border: 1px solid var(--line);
    background: var(--panel); border-radius: 20px; cursor: pointer; color: var(--muted); }
  nav button.on, .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .filters input { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: var(--radius); min-width: 230px; background: var(--panel); color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px; }
  .card.click { cursor: pointer; }
  .card.click:hover { border-color: var(--accent); }
  .verdict { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: #fff; }
  .v-corroborates { background: var(--corroborates); }
  .v-contradicts { background: var(--contradicts); }
  .v-reconciled_by_context { background: var(--reconciled); }
  .v-insufficient_context { background: var(--insufficient); }
  .v-unrelated { background: #999; }
  .meta { color: var(--muted); font-size: 12px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  @media (max-width: 820px) { .pair { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; background: #fdfdfc; }
  .val { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .quals { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .q { font-size: 11.5px; background: #eef1ee; border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 6px; }
  .q i { color: var(--muted); font-style: normal; }
  .why { margin-top: 11px; padding: 10px 12px; background: #f5f4f0; border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius) var(--radius) 0; }
  .ctx { white-space: pre-wrap; word-break: break-word; max-height: 230px; overflow-y: auto;
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 9px; margin-top: 9px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: #55554f; }
  mark { background: var(--mark); border-bottom: 2px solid var(--mark-line); color: var(--ink); padding: 1px 0; }
  .verify { margin-top: 8px; font-size: 12px; }
  .ok { color: var(--corroborates); font-weight: 600; }
  .bad { color: var(--contradicts); font-weight: 600; }
  .drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 22px;
    text-align: center; color: var(--muted); margin-bottom: 16px; background: var(--panel); }
  .drop.over { border-color: var(--accent); background: #f2f7f5; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
  .tag.flag { color: #92400e; border-color: #fbbf24; background: #fffbeb; }
  .ev { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--line); align-items: baseline; }
  .ev:last-child { border-bottom: none; }
  .ev .what { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .e-predicate_registered { color: var(--corroborates); }
  .e-alias_confirmed { color: var(--reconciled); }
  .e-alias_rejected { color: var(--contradicts); }
  .e-predicate_seen { color: var(--muted); font-weight: 400 !important; }
  button.link { background: none; border: none; color: var(--accent); cursor: pointer;
    font: inherit; padding: 0; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Concord <small>grounded facts, reconciled across documents</small></h1>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div class="drop" id="drop">
    <b>Drop a PDF here</b> or <button class="link" id="pick">choose a file</button>
    <div class="meta" id="dropmsg">Every fact it produces round-trips to bytes in this file.</div>
    <input type="file" id="file" accept="application/pdf" hidden>
  </div>

  <nav>
    <button data-view="relations" class="on">Relations</button>
    <button data-view="facts">Fact ledger</button>
    <button data-view="quarantine">Quarantine</button>
    <button data-view="schema">Schema timeline</button>
  </nav>

  <div id="filters" class="filters"></div>
  <div id="content"><div class="empty">Loading…</div></div>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (p, o) => { const r = await fetch(p, o); if (!r.ok) throw new Error((await r.json()).detail || r.status); return r.json(); };

let view = "relations", verdictFilter = "", xdocOnly = false, search = "";
const openRelations = new Set();

async function stats() {
  const s = await api("/stats");
  $("#stats").innerHTML = `
    <span><b>${s.documents}</b> documents</span>
    <span><b>${s.facts}</b> grounded facts</span>
    <span><b>${s.quarantined}</b> quarantined <i>(${(s.quarantine_rate * 100).toFixed(1)}%)</i></span>
    <span><b>${s.relations}</b> relations</span>`;
}

function qualifiers(f) {
  const q = f.qualifiers || {};
  const keys = Object.keys(q).sort();
  if (!keys.length) return `<div class="quals"><span class="q"><i>no conditions recorded</i></span></div>`;
  return `<div class="quals">${keys.map(k =>
    `<span class="q">${esc(k)}: ${esc(q[k].value)} <i>[${esc(q[k].provenance)}]</i></span>`).join("")}</div>`;
}

function flags(f) {
  // A flag is a fact the system will still compare but wants a reviewer to
  // look at. `subject_names_the_measurement` is the loudest of them: the value
  // and the quote are sound and the subject is the table's row label, which is
  // half of the comparison key.
  return (f.flags || []).map(x =>
    `<span class="tag flag">⚠ ${esc(x.replace(/_/g, " "))}</span>`).join("");
}

function factSide(f) {
  if (!f) return `<div class="side"><i class="meta">fact missing</i></div>`;
  return `<div class="side">
    <div class="meta">${esc(f.doc_id)} · page ${f.page} · <code>${esc(f.predicate)}</code></div>
    <div class="val">${esc(f.value?.raw ?? f.claim_text)}</div>
    <div class="meta">${esc(f.subject.surface)}${f.subject.key ? " · " + esc(f.subject.key) : ""} ${flags(f)}</div>
    ${qualifiers(f)}
    <div class="evidence"></div>
    <div class="verify"><button class="link" onclick="showEvidence('${f.fact_id}', this)">show evidence &amp; verify</button></div>
  </div>`;
}

// The box is found from the button that was clicked, never by fact id. One
// fact can appear in several open relation cards and again in the ledger, so
// an id keyed on it is not unique on the page: `querySelector` returned the
// first match in document order and a reviewer clicking the lower card was
// shown - and told "verified" about - a different occurrence's evidence. See
// bug 22 in docs/status.md.
window.showEvidence = async function (id, btn) {
  const box = btn.closest(".side, .card").querySelector(".evidence");
  if (!box || box.dataset.open) { if (box) { box.innerHTML = ""; delete box.dataset.open; } return; }
  box.dataset.open = "1";
  box.innerHTML = `<div class="meta">loading…</div>`;
  const [ev, vr] = await Promise.all([api("/evidence/" + id), api("/verify/" + id)]);
  let html = "";
  if (ev.located) {
    const [a, b] = ev.highlight, c = ev.context;
    html += `<div class="ctx">${esc(c.slice(0, a))}<mark>${esc(c.slice(a, b))}</mark>${esc(c.slice(b))}</div>`;
  } else {
    html += `<div class="ctx"><i>quarantined — the quote was never located in the source</i></div>`;
  }
  html += `<div class="verify">${vr.verified
    ? `<span class="ok">✓ verified</span> <span class="meta">chars ${vr.char_start}–${vr.char_end} re-read from the source match the stored quote exactly</span>`
    : `<span class="bad">✗ not verified</span> <span class="meta">${esc(vr.reason || "the source no longer matches the stored quote")}</span>`}</div>`;
  box.innerHTML = html;
};

window.toggleRelation = function (id) {
  openRelations.has(id) ? openRelations.delete(id) : openRelations.add(id);
  render();
};

async function renderRelations() {
  const p = new URLSearchParams({ limit: "300" });
  if (verdictFilter) p.set("verdict", verdictFilter);
  if (xdocOnly) p.set("cross_document", "true");
  const { relations, total } = await api("/relations?" + p);

  $("#filters").innerHTML = ["", "corroborates", "contradicts", "reconciled_by_context", "insufficient_context"]
    .map(v => `<button data-verdict="${v}" class="${verdictFilter === v ? "on" : ""}">${v || "all"}</button>`).join("")
    + `<button data-xdoc="1" class="${xdocOnly ? "on" : ""}">cross-document only</button>`
    + `<span class="meta">${total} shown</span>`;

  if (!relations.length) return `<div class="empty">No relations yet. Upload a PDF — then a second one, so facts have something to disagree with.</div>`;

  return relations.map(r => {
    const open = openRelations.has(r.relation_id);
    return `<div class="card">
      <div class="row click" onclick="toggleRelation('${r.relation_id}')">
        <div>
          <span class="verdict v-${r.verdict}">${r.verdict.replace(/_/g, " ")}</span>
          ${r.cross_document ? `<span class="tag">cross-document</span>` : ""}
          ${r.qualifier_key ? `<span class="tag">on ${esc(r.qualifier_key)}</span>` : ""}
          <span class="tag">${esc(r.decided_by)}</span>
        </div>
        <span class="meta mono">${esc(r.rule_fired)} ${open ? "▾" : "▸"}</span>
      </div>
      ${open ? `<div class="pair">${factSide(r.a_fact)}${factSide(r.b_fact)}</div>
        <div class="why">${esc(r.explanation)}</div>
        <div class="meta" style="margin-top:6px">found by: ${r.blocked_by.join(", ") || "—"}</div>` : ""}
    </div>`;
  }).join("");
}

async function renderFacts(quarantined) {
  const p = new URLSearchParams({ limit: "300", quarantined: String(quarantined) });
  if (search) p.set("q", search);
  const { facts, total } = await api("/facts?" + p);

  // Keep the input node alive during searches so its caret and selection survive.
  if (!$("#search")) {
    $("#filters").innerHTML = `<input id="search" placeholder="search claims, subjects, predicates" value="${esc(search)}">
      <span class="meta" id="fact-count"></span>`;
  }
  $("#fact-count").textContent = `${total} ${quarantined ? "quarantined" : "grounded"} facts`;

  if (!facts.length) {
    return `<div class="empty">${quarantined
      ? "Nothing quarantined. Every extracted quote located in its source."
      : "No facts yet — upload a PDF."}</div>`;
  }

  return facts.map(f => `<div class="card">
    <div class="row">
      <div><code>${esc(f.predicate)}</code> <span class="val">${esc(f.value?.raw ?? "")}</span></div>
      <span class="meta">${flags(f)} ${esc(f.doc_id)} · p${f.page} · ${esc(f.align_status)}</span>
    </div>
    <div class="meta">${esc(f.claim_text)}</div>
    ${qualifiers(f)}
    <div class="evidence"></div>
    <div class="verify"><button class="link" onclick="showEvidence('${f.fact_id}', this)">show evidence &amp; verify</button></div>
  </div>`).join("");
}

async function renderSchema() {
  const s = await api("/schema?limit=400");
  $("#filters").innerHTML = `<span class="meta"><b>${s.predicates}</b> predicates ·
    <b>${s.aliases}</b> aliases confirmed ·
    ${Object.entries(s.event_counts).map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(" · ")}</span>`;

  if (!s.predicates) return `<div class="empty">No predicates yet — the schema is written by the documents, so upload one.</div>`;

  const timeline = s.timeline.filter(e => e.event_type !== "predicate_seen");
  return `<div class="card">
      <b>What the layer learned, most recent first</b>
      <div class="meta">Nothing here was declared up front. Every predicate arrived in a document; an alias was only merged after a similarity above threshold was confirmed by a model.</div>
      <div style="margin-top:10px">${timeline.length ? timeline.map(e => `
        <div class="ev">
          <span class="what e-${e.event_type}">${e.event_type.replace(/_/g, " ")}</span>
          <span><code>${esc(e.subject)}</code>${e.target ? ` → <code>${esc(e.target)}</code>` : ""}
            ${e.similarity != null ? `<span class="tag">cos ${e.similarity.toFixed(3)}</span>` : ""}
            <span class="tag">${esc(e.decided_by)}</span></span>
          <span class="meta">${esc(e.doc_id || "")}</span>
        </div>`).join("") : `<div class="meta">Only repeat sightings so far.</div>`}</div>
    </div>
    <div class="card"><b>Vocabulary</b>
      <div style="margin-top:8px">${s.entries.map(e => `
        <div class="ev">
          <code>${esc(e.canonical)}</code>
          <span class="meta">${e.aliases.length ? "also: " + e.aliases.map(esc).join(", ") : ""}</span>
          <span class="meta">${e.count}×</span>
        </div>`).join("")}</div>
    </div>`;
}

async function render() {
  const el = $("#content");
  try {
    el.innerHTML = view === "relations" ? await renderRelations()
      : view === "schema" ? await renderSchema()
      : await renderFacts(view === "quarantine");
  } catch (e) {
    el.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
  const s = $("#search");
  if (s && !s.oninput) {
    const refresh = debounce(() => { if (s.isConnected) render(); }, 300);
    s.oninput = () => { search = s.value; refresh(); };
  }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

document.querySelector("nav").onclick = e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  view = b.dataset.view;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  render();
};

$("#filters").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.xdoc) xdocOnly = !xdocOnly;
  else if (b.dataset.verdict !== undefined) verdictFilter = b.dataset.verdict;
  render();
};

async function upload(f) {
  const msg = $("#dropmsg");
  msg.textContent = `Ingesting ${f.name} — parsing, extracting, grounding, comparing…`;
  const body = new FormData(); body.append("file", f);
  try {
    const r = await api("/ingest", { method: "POST", body });
    msg.innerHTML = `<b>${esc(r.doc_id)}</b>: ${r.facts} facts from ${r.chunks} chunks over ${r.pages} pages
      · ${r.quarantined} quarantined · ${r.requests} LLM requests ·
      ${r.blocking.candidates} candidate pairs from ${r.blocking.theoretical_pairs}
      (${(r.blocking.reduction * 100).toFixed(2)}% reduction) · ${r.llm_pairs} pairs needed a model
      ${r.schema ? `· schema: ${r.schema.new_predicates} new predicates,
      ${r.schema.aliases_confirmed} aliased (${r.schema.predicates_known} known)` : ""}`;
    await stats(); await render();
  } catch (e) { msg.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}

const drop = $("#drop");
$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => e.target.files[0] && upload(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };

stats(); render();
</script>
</body>
</html>
