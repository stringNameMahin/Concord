[project]
name = "concord"
version = "0.1.0"
description = "Fact knowledge layer: grounded facts with cross-document reconciliation"
requires-python = ">=3.12,<3.14"

# Pinned to 3.12/3.13 deliberately. sentence-transformers pulls torch, and
# torch wheels are unreliable on 3.14 - see docs/decisions.md. `uv venv
# --python 3.12` fetches a managed interpreter, so the pin costs nothing.

dependencies = [
    # HTTP surface. python-multipart is not imported anywhere in this
    # package but FastAPI requires it to accept the `UploadFile` on /ingest,
    # so leaving it out breaks the reviewer's first action.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # LLM client: raw HTTP plus schema validation. No framework - see
    # docs/decisions.md for why LangChain was rejected.
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",

    # Parsing and grounding.
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",

    # Blocking. sentence-transformers is the one heavy dependency: it pulls
    # torch, which is a large download. It stays a required dependency rather
    # than an extra because the semantic block finds most candidate pairs and
    # the system is materially worse without it.
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises the local embedding model; needs the model files present",
]
